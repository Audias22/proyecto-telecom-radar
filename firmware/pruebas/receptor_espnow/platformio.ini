; Receptor ESP-NOW de prueba para el colgante: ESP32 clásico (DevKitC con módulo WROOM-32).
; Herramienta de banco, no es la base real.
;
; Misma plataforma pioarduino (arduino-esp32 3.3.7) que el colgante y la base. "esp32dev" es la
; definición genérica de pioarduino para placas con ESP32-WROOM-32 (4 MB de flash).

[platformio]
default_envs = receptor

[env:receptor]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32dev
framework = arduino

; El DevKitC usa un puente USB-UART (CP2102 o CH340): Serial sale por el micro-USB.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Para escribir comandos y ver lo tecleado en el monitor.
monitor_echo = yes

lib_deps =
    symlink://../../comun/protocolo

build_flags =
    -Wall
