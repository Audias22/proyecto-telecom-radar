; Firmware de la base: kit Seeed MR60BHA2 con XIAO ESP32-C6.
;
; Se usa pioarduino (arduino-esp32 v3) porque la plataforma oficial de PlatformIO no soporta
; bien el ESP32-C6. La versión queda fija para que todo el equipo compile con lo mismo.
; 55.03.37 = arduino-esp32 3.3.7. Las versiones más nuevas piden PlatformIO Core >= 6.1.19.

[platformio]
default_envs = base

[env:base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino

; La placa ya define ARDUINO_USB_MODE=1 y ARDUINO_USB_CDC_ON_BOOT=1: Serial sale por el USB-C.
monitor_speed = 115200

; Sin OTA: una sola app de 3 MB (huge_app.csv de arduino-esp32 3.3.7) en lugar de las dos de
; 1.25 MB de default.csv. NVS, otadata y coredump quedan en las mismas direcciones, así que no
; hace falta borrar la flash al cambiarla (firmware/base-radar/README.md, "Memoria").
board_build.partitions = huge_app.csv
monitor_filters = esp32_exception_decoder

; - protocolo: librería compartida con el colgante (firmware/comun/protocolo).
; - Seeed Arduino mmWave: librería oficial del MR60BHA2. No está en el registro de PlatformIO,
;   así que se fija por commit. ade050c = rama main (v1.0.0, la versión publicada en el
;   Library Manager de Arduino); las v1.1.0-rc1 y v2.0.0-rc1 no están validadas en hardware.
lib_deps =
    symlink://../comun/protocolo
    https://github.com/Seeed-Projects/Seeed-mmWave-library.git#ade050c62f874c214fe83ebb586d723c46b03226

build_flags =
    -Wall

; Firmware de diagnóstico del radar (src/diagnostico.cpp en lugar de main.cpp):
;   pio run -e diagnostico -t upload
[env:diagnostico]
extends = env:base
build_flags =
    ${env:base.build_flags}
    -DDIAGNOSTICO
