; Firmware del colgante: ESP32-C3 Super Mini.
;
; Misma plataforma pioarduino (arduino-esp32 v3) que la base, para compartir versión de ESP-NOW.
; 55.03.37 = arduino-esp32 3.3.7. Las versiones más nuevas piden PlatformIO Core >= 6.1.19.

[platformio]
default_envs = colgante

[env:colgante]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = nologo_esp32c3_super_mini
framework = arduino

; La placa ya define ARDUINO_USB_MODE=1 y ARDUINO_USB_CDC_ON_BOOT=1: Serial sale por el USB-C
; desde el arranque. Ojo: el USB CDC se desconecta durante el deep sleep.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Por confirmar con el módulo: la definición de placa usa flash en modo QIO. Si el módulo no
; arranca después de cargar, probar con:
; board_build.flash_mode = dio

; Librería compartida con la base (firmware/comun/protocolo).
lib_deps =
    symlink://../comun/protocolo

build_flags =
    -Wall
